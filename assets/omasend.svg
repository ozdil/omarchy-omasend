<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Atmosphere -->
    <radialGradient id="bgGlow" cx="65%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0F2442" />
      <stop offset="50%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#03060B" />
    </radialGradient>

    <!-- Holographic Neon Gradients -->
    <linearGradient id="neonCyanBlue" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="45%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="neonTealEmerald" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="neonLightShade" x1="70%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="darkFacetShade" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="thrusterGlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <!-- Filters: Glow & Drop Shadows -->
    <filter id="vectorBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00D2FF" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1E293B" stroke-width="1.5" opacity="0.6" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#neonCyanBlue)" stroke-width="1" opacity="0.3" />

  <!-- Subtle Stealth Aerospace Grid Accent -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,6">
    <line x1="64" y1="448" x2="448" y2="64" />
    <circle cx="256" cy="256" r="160" fill="none" />
    <circle cx="256" cy="256" r="98" fill="none" />
    <circle cx="440" cy="72" r="32" fill="none" />
  </g>

  <!-- Ambient Underglow -->
  <ellipse cx="290" cy="220" rx="160" ry="120" transform="rotate(-45 290 220)" fill="#00F5FF" opacity="0.15" filter="url(#vectorBloom)" />

  <!-- Master Plane Vector Group -->
  <g filter="url(#dropShadow)">
    
    <!-- Twin Stabilizers -->
    <path d="M 248.00 264.00 L 104.00 360.00 L 156.00 396.00 L 212.00 300.00 Z" fill="url(#neonTealEmerald)" opacity="0.9" />
    <path d="M 248.00 264.00 L 152.00 408.00 L 116.00 356.00 L 212.00 300.00 Z" fill="url(#darkFacetShade)" opacity="0.95" />

    <!-- Outboard Swept Wings (Port & Starboard) -->
    <path d="M 404.00 108.00 L 274.00 96.00 L 72.00 198.00 L 138.00 264.00 L 168.00 246.00 L 226.00 286.00 L 342.00 170.00 Z" fill="url(#neonCyanBlue)" />
    <path d="M 404.00 108.00 L 274.00 96.00 L 220.00 180.00 L 342.00 170.00 Z" fill="url(#neonLightShade)" opacity="0.75" />

    <path d="M 404.00 108.00 L 416.00 238.00 L 314.00 440.00 L 248.00 374.00 L 266.00 344.00 L 226.00 286.00 L 342.00 170.00 Z" fill="url(#darkFacetShade)" />
    <path d="M 404.00 108.00 L 416.00 238.00 L 332.00 292.00 L 342.00 170.00 Z" fill="url(#neonCyanBlue)" opacity="0.4" />

    <!-- Thruster Bay Exhaust & Ion Core -->
    <path d="M 266.00 246.00 L 228.00 274.00 L 174.00 338.00 L 238.00 284.00 Z" fill="#030712" />
    <path d="M 266.00 246.00 L 216.00 296.00 L 116.00 396.00 L 216.00 296.00 Z" fill="url(#thrusterGlow)" filter="url(#vectorBloom)" opacity="0.85" />

    <!-- Center Fuselage Nose Diamond (Spine & Chined Cockpit) -->
    <path d="M 440.00 72.00 L 328.00 146.00 L 282.00 230.00 Z" fill="url(#neonLightShade)" />
    <path d="M 440.00 72.00 L 282.00 230.00 L 366.00 184.00 Z" fill="url(#neonCyanBlue)" />

    <!-- Razor Edge Highlights -->
    <line x1="440" y1="72" x2="282" y2="230" stroke="#FFFFFF" stroke-width="2" opacity="0.9" filter="url(#vectorBloom)" />
    <line x1="440" y1="72" x2="328" y2="146" stroke="#E0F2FE" stroke-width="1.5" opacity="0.8" />
    <line x1="404" y1="108" x2="72" y2="198" stroke="#38BDF8" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Dynamic Vector Ascent Arrow Tip Particle -->
  <circle cx="440" cy="72" r="3.5" fill="#FFFFFF" filter="url(#vectorBloom)" />
</svg>
