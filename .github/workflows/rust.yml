name: Rust

on:
  push:
    branches: [ "main", "next" ]
  pull_request:
    branches: [ "main", "next" ]

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # qrencode renders the PNG pairing QR (test_desktop_oma_id_qr_generation_and_caching).
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y qrencode

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            core

      - name: Test engine
        run: cargo test --bin omasend-engine

      - name: Test core
        working-directory: core
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets
