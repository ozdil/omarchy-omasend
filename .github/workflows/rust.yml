name: Rust

on:
  push:
    branches: [ "main", "next" ]
  pull_request:
    branches: [ "main", "next" ]

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            core

      - name: Test engine
        run: cargo test --locked --bin omasend-engine

      - name: Test core
        working-directory: core
        run: cargo test --locked

      # cargo fmt --check is not enforced yet: the tree predates rustfmt and is not fmt-clean.
      - name: Clippy (engine)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (core)
        working-directory: core
        run: cargo clippy --locked --all-targets -- -D warnings
