[package]
name = "omasend-engine"
version = "1.3.0"
edition = "2021"
authors = ["Ozan Özdil <ozan@pm.me>"]
description = "Wireless AirBridge, QR file transfer, and cross-device sharing daemon for Omarchy"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
hex = "0.4"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
