[package]
name = "omasend-engine"
version = "1.9.1"
edition = "2021"
authors = ["Ozan Özdil <ozan@pm.me>"]
description = "Anonymous Numbered Identity (Zero-Log OmaID), Zero-Click AirBridge, QR file transfer, and cross-device sharing daemon for Omarchy"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
hex = "0.4"
getrandom = "0.2"
sha2 = "0.10"
md5 = "0.7"
libc = "0.2"
blake3 = "1.5"
zeroize = { version = "1.8", features = ["derive"] }
ed25519-dalek = "2"
base64 = "0.22"
omasend-core = { path = "core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
