[package]
name = "omasend-engine"
version = "2.0.0"
edition = "2021"
authors = ["Ozan Özdil <ozan@pm.me>"]
description = "File and clipboard sharing daemon for Omarchy: QR-paired devices over encrypted QUIC (TLS 1.3)"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
hex = "0.4"
getrandom = "0.2"
sha2 = "0.10"
md5 = "0.7"
libc = "0.2"
blake3 = "1.5"
zeroize = { version = "1.8", features = ["derive"] }
ed25519-dalek = "2"
base64 = "0.22"
omasend-core = { path = "core" }
qrcode = { version = "0.14", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
