[package]
name = "omasend-core"
version = "0.2.0"
edition = "2021"
description = "OmaSend transport core: iroh (QUIC/TLS 1.3) with paired Ed25519 device keys, BLAKE3-verified resumable transfers"
license = "MIT"

[lib]
name = "omasend_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
iroh = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.5"
base64 = "0.22"
thiserror = "2"
getrandom = "0.2"
libc = "0.2"
uniffi = "0.32"
# Account (OmaID) crypto, shared by the desktop engine and Android.
argon2 = "0.5"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
ed25519-dalek = "2"
curve25519-dalek = "4"
zeroize = "1.8"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
