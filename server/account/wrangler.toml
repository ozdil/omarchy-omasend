name = "omaid-account"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [{ pattern = "id.omaid.app", custom_domain = true }]

# No request logs: the registry keeps nothing about who asked.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "omaid-account"
database_id = "caffedc6-0f55-48a2-b392-495a0d4ea798"

# Per-IP budgets, enforced in memory at the edge; IPs are never stored.
[[ratelimits]]
name = "READS"
namespace_id = "7301"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "WRITES"
namespace_id = "7302"
simple = { limit = 20, period = 60 }

[triggers]
crons = ["17 3 * * 1"]
